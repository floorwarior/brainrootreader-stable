{% extends "base.html" %}


{% block content %}
<div x-data="convert" class="flex flex-col text-center h-full w-full">
    <div class="flex flex-col my-auto mx-auto">
        <h2 class="text-gray-12 text-2xl">{{books_name[:25]}}. . . <br>is converting</h2>
        <h3 class="text-gray-11">
            This will take some time
        </h3>
        <div class="flex flex-col text-gray-11">
        <h4 x-show="state == 'in_progress' " class="text-green-11" x-text="`[${current_items} / ${total_items}]`"></h4>
        <h4 x-cloak x-show="state == 'finished'"  x-text="()=>{return `You audio file is located at : ${file_location}`}"></h4>
        <h4 x-cloak x-show="state == 'error'"  x-text="()=>{return `Audio conversion failed with error: ${error}`}"></h4>
        </div>
    </div>
</div>
<script src="/static/js/socket.io.js"></script>

<script>
    const  book_id = "{{book_id}}"
    document.addEventListener("alpine:init", () => {
        Alpine.data("convert",()=>({
            book_name:"",
            state:"in_progress",
            file_location:"",
            error:"",
            total_items:0,
            estimated:0,
            current_items:0,
            async init(){
                //
                var socket = io();
                var component = this
                socket.on('async_progress', function(data) {
                    if (data.book_id == book_id){
                        component.total_items = data.total_items,
                        component.current_items = data.current_items
                    }

                });

                socket.on("progress",function(data) {
                    if (data.book_id == book_id){
                        component.total_items = data.total_pages,
                        component.current_items = data.page_num
                    }
                })

                socket.on("audioconversion_finished",function (data){
                    if (data.book_id == book_id){
                        component.state = "finished"
                        component.file_location = data.filename
                    }
                })


                socket.on("audioconversion_error",function (data){
                    if (data.book_id == book_id){
                        component.state = "error"
                        component.error = data.error
                    }
                })

            }
        }))
    })





</script>

{% endblock %}
