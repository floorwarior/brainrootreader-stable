[app]
port = "5003"
host = "localhost"
debug = true
audio_method = "subprocess"
template_folder = "templates"


[subprocess]
core_count = "2"
use = "ReaderCoreConnector"
starting_port = 4222
throttle = false
throttle_for = 2
throttle_step = 1
# throttle makes it so your readercores take rests between cycles, this allows other apps like your browser or other application to take turns using it

[style]
theme = "NEW_THEME"

[startup]
loading_window = false


[shutdown]
shutdown_after = "2400"
auto_shutdown = true


[reader]
selected_reader = "PocketTTSReader"
fallback_order = ["WinReader"]


# ABOUT:
# no config item can contain . 